version: "3.8"

services:
  user_service:
    build: ./user_service
    ports:
      - "8085:8085"
    networks:
      - library_net

  book_service:
    build: ./book_service
    ports:
      - "8084:8084"
    networks:
      - library_net

  loan_service:
    build: ./loan_service
    ports:
      - "8080:8080"
    networks:
      - library_net
    environment:
      USER_URL: http://user_service:8085  
      BOOK_URL: http://book_service:8084  

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - book_service
      - loan_service
    networks:
      - library_net      

networks:
  library_net: